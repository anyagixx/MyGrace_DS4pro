# MyGRACE release workflow — tag-driven release QA, artifact packing and GitHub Release.
#
# Distribution decision (2026-11-25): MyGRACE is **not published to npm**.
# Releases are GitHub Releases with a packed tarball (`mygrace-cli-<version>.tgz`)
# plus the source checkout; `@osovv` is a third-party scope and is not used.
#
# Triggers:
#   * push of a tag matching v* (e.g. v1.7.2) — gates + artifact + GitHub Release
#   * manual workflow_dispatch — gates + artifact dry-run only (no release)
#
# Gates (must all pass):
#   1. `bun run release:check` — typecheck, full tests + demo tests, demo lint,
#      `mygrace ci` self-check, marketplace/docs validators, diagram/capsule gates,
#      pack-smoke.
#   2. `bun run publish:dry`   — packs the tarball, verifies file/import
#      completeness, installs it offline and runs the packaged CLI (artifact gate;
#      it does not contact any registry).
#   3. Tag/version consistency — v1.7.2 tag must match package.json 1.7.2.
#
# The tarball is uploaded as a workflow artifact on every run and attached to a
# GitHub Release on tag pushes. No npm credentials or NPM_TOKEN are used.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release (${{ github.event_name }})
    runs-on: ubuntu-latest
    # Needed only for the tag-push `gh release create` step; the workflow itself
    # stays read-only for every other trigger.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Release gates (typecheck, tests, lint, self-ci, validators, pack-smoke)
        run: bun run release:check

      - name: Artifact dry-run (pack, static import completeness, offline install, packaged CLI)
        run: bun run publish:dry

      - name: Tag matches package.json version
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${VERSION} (expected v${VERSION})"
            exit 1
          fi
          echo "tag ${TAG} matches package.json version ${VERSION}"

      - name: Pack release tarball and checksums
        run: |
          mkdir -p dist
          bun pm pack --destination dist
          cd dist
          sha256sum *.tgz > SHA256SUMS
          cat SHA256SUMS
          ls -l

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tgz

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mygrace-cli-tarball
          path: |
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (tag push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists — refreshing the tarball asset"
            gh release upload "${GITHUB_REF_NAME}" dist/*.tgz dist/SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.tgz dist/SHA256SUMS --generate-notes --verify-tag
          fi

      - name: Manual run notice (nothing released)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Manual run — release gates and artifact dry-run passed; no release was created."
